    note: 'Owner order 2026-10-21 (GPT quota restored): PLAN is openai-codex/gpt-6.1-sol and VERIFY_SECURITY
      is openai-codex/gpt-6.1-sol. The models are the SAME, so the collision is REAL and is declared OPEN_OWNER_ORDERED;
      independence for this pair is PROCESS separation only and model independence is NOT claimed.'
  declared_conflicts:
  - id: SOD006-C1
    pairs:
    - - PLAN
      - VERIFY_SECURITY
    axis: canonical_identity
    status: SUPERSEDED
    resolution: WO-FAR-D1D2-FINAL-ROUTE-20261008 / REQ-FAR-D1D2-FINAL-20261008 (owner adjudication; events=947)
    resolved_by_rebinding: owner adjudication 1 (round HGK-SOLUTION-APPLY-20261012); PLAN rebound to opencode-go/deepseek-v4.1-flash
      so PLAN no longer collides with any VERIFY arm. Historical record preserved.
  - id: SOD006-C3
    pairs:
    - - EXECUTE
      - VERIFY_SECURITY
    axis: canonical_identity
    status: SUPERSEDED
    note: 'Owner order 2026-10-16 (round ROUND3-LANE-REBIND-AND-CLOSURE-20261016) puts the VERIFY/SECURITY
      checker on opencode-go/deepseek-v4.1-flash, the SAME model the EXECUTE bounded writer holds. Model-axis
      independence between writer and checker is therefore deliberately ABSENT BY ORDER. The pair is demoted
      to distinct_required: false and the collision is recorded here rather than hidden. The lane guard
      refuses this pair when the declaration is absent (measured ERR_LANE_SOD_VIOLATION), so this entry
      is load-bearing, not documentation. What remains after model-axis independence is given up: PROCESS
      independence (a separate sealed CODEX-CLI process with a fresh context), LANE independence (EXECUTE
      makes, VERIFY_SECURITY checks), EVIDENCE-PATH independence (the checker re-derives every decisive
      claim from the artifacts and is forbidden from reading the writer''s summary), and the no-self-acceptance
      rule (the dispatcher refuses any single call that would verify its own output). What is NOT hedged:
      correlated blind spots in the shared model family -- recorded as an accepted deviation.'
    reconciliation:
      ruled_by: owner order 2026-10-16 (round ROUND3-LANE-REBIND-AND-CLOSURE-20261016)
      reclassified_from: null
    residual: maker and checker are the same model; model diversity is NOT claimed anywhere in this round's
      artifacts.
    superseded_by: SOD006-C4 / owner order 2026-10-21 (round FAR-REMEDIATION-20261021, epoch 23)
  - id: SOD006-C2
    pairs:
