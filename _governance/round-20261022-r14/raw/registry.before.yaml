    axis: canonical_identity
    status: SUPERSEDED
    superseded_by: 'owner-order-20261016-lane-rebind-plan-glm-verify-deepseek (round ROUND3-LANE-REBIND-AND-CLOSURE-20261016):
      its premise -- PLAN and VERIFY/SECURITY sharing the openai-codex/gpt-6.1-sol default arm -- no longer
      holds, so the collision it recorded is gone. The order and its compensating controls are preserved
      here as history, never deleted.'
    note: 'Round FAR-LANE-ROUTE-REBIND-20261015 re-pointed PLAN and VERIFY_SECURITY to the same default
      arm (openai-codex/gpt-6.1-sol, medium); the owner order in force for round FAR-REMEDIATION-AND-CLOSURE-20261016
      restates it. This is therefore NOT an open item awaiting a decision: it is an order that has been
      carried into force, and it is recorded as an ACCEPTED deviation rather than as a satisfied invariant.
      What remains after model-axis independence is given up: PROCESS independence (a separate sealed
      CODEX-CLI process with a fresh context), LANE independence (EXECUTE makes, VERIFY_SECURITY checks),
      EVIDENCE-PATH independence (the checker re-derives every decisive claim from the artifacts and is
      forbidden from reading the writer''s summary), and the no-self-acceptance rule (the dispatcher refuses
      any single call that would verify its own output). What is NOT hedged: correlated blind spots in
      the shared model family. EXECUTE-vs-VERIFY model separation still HOLDS (deepseek-v4.1-flash !=
      gpt-6.1-sol).'
    reconciliation:
      ruled_by: owner orders 2026-10-15 and 2026-10-16 (both name openai-codex/gpt-6.1-sol for PLAN and
        VERIFY_SECURITY)
      reclassified_from: OPEN_OWNER_ORDERED
      reclassified_by_round: FAR-REMEDIATION-AND-CLOSURE-20261016 (R3)"
  - id: SOD-APPLY-01
    pairs:
    - - EXECUTE
      - PLAN
    axis: canonical_identity
    status: OPEN
    note: PLAN and EXECUTE were both rebound onto opencode-go/deepseek-v4.1-flash; they are both maker/executor
      routes and never check each other, but the model-axis collision is recorded, not hidden.
    reconciliation:
      ruled_by: owner adjudication, round HGK-SOLUTION-APPLY-20261012 (Option 1 step (a); AMENDMENT_03)
      decision_ref: FAR-RUN-W6-PLAN-SOD-020 / DEC-020-1
      what: the strict entry (maker EXECUTE, checker PLAN, distinct_required true) was REMOVED from sod_invariants.pairs.
        The overlap remains RECORDED here rather than refused, which is what the owner's own 2026-10-10
        lane-route-slots declaration already says -- selection_semantics.sod is "NOT enforced; identity
        overlaps are recorded as facts only, not as refusals", and identity_overlaps_recorded_not_enforced
        lists this very identity.
      why_not_a_model_change: PLAN's binding (opencode-go/deepseek-v4.1-flash) is the owner's declared
        rank-1 DEFAULT for the PLAN lane; moving it would have been rework and would have displaced the
        owner's own pool declaration. The defect was the ENCODING, not the binding.
      compensating_control:
      - 'structural: PLAN and EXECUTE are both maker/executor routes and never check each other; the acceptance/verification
        route is the dedicated VERIFY_SECURITY lane (arm A), the only lane that checks another lane''s
        artifacts.'
      - 'artifact-level: every checker lane writes through the C1 verdict-artifact contract (write-first,
        shape-validated, updated_by_checker), so a checker cannot pass by omission.'
      - 'per-card: the reasoning pin of the checking lane is recorded per card.'
      residual: with the model axis no longer enforced between the two maker/executor routes, the remaining
        separation between them is ROLE and ARTIFACT, not model identity. Recorded as an accepted risk,
        not as a passing invariant.
  - id: SOD006-C4
    pairs:
    - - PLAN
      - VERIFY_SECURITY
    axis: canonical_identity
    status: OPEN_OWNER_ORDERED
    statement: Owner order 2026-10-21 mandates PLAN & Orchestrator = openai-codex/gpt-6.1-sol (medium,
