decided_basis: >-
  FAR-PIPD-R5Q-LICENSE-001 (in-round quick study). Two-stage decision: the technical review had
  already returned GO_WITH_DISCLOSED_LIMITATIONS for an S4 open-source preview, so the remaining
  question was the licence itself. Apache-2.0 was selected over MIT / BSD-3-Clause / MPL-2.0 /
  AGPL-3.0 / dual-licensing on: explicit patent grant (section 3), the NOTICE attribution mechanism
  (section 4(d)) that this repository needs to carry its provenance split, trademark non-grant
  (section 6), and compatibility with its MIT dependency. The cost accepted: section 4(b) adds a
  modified-file notice obligation for downstream modifiers, which MIT does not have.
