sod_invariants:
  comparison_axis: canonical_identity
  provider_axis_required: false
  pairs:
  - maker: EXECUTE
    checker: VERIFY_SECURITY
    distinct_required: false
    note: 'Owner order 2026-10-23 (R15): EXECUTE bounded writer and VERIFY_SECURITY checker are BOTH opencode-go/deepseek-v4.1-flash, so model-axis separation is absent by order. Separation is PROCESS (separate sealed CODEX-CLI process, fresh context), LANE and EVIDENCE-PATH only. Declared as SOD006-C7; not claimed as model independence.'
  - maker: PLAN
    checker: VERIFY_SECURITY
    distinct_required: false
    note: 'Owner order 2026-10-22 (GPT quota exhausted): PLAN moved to opencode-go/deepseek-v4.1-flash, so PLAN and VERIFY_SECURITY share one canonical identity. Separation is process-only; declared as SOD006-C5 rather than claimed as model independence.'
  declared_conflicts:
  - id: SOD006-C1
    pairs:
    - - PLAN
      - VERIFY_SECURITY
    axis: canonical_identity
    status: SUPERSEDED
    resolution: WO-FAR-D1D2-FINAL-ROUTE-20261008 / REQ-FAR-D1D2-FINAL-20261008 (owner adjudication; events=947)
    resolved_by_rebinding: owner adjudication 1 (round HGK-SOLUTION-APPLY-20261012); PLAN rebound to opencode-go/deepseek-v4.1-flash so PLAN no longer collides with any VERIFY arm. Historical record preserved.
  - id: SOD006-C3
    pairs:
    - - EXECUTE
      - VERIFY_SECURITY
    axis: canonical_identity
    status: SUPERSEDED
    note: 'Owner order 2026-10-16 (round ROUND3-LANE-REBIND-AND-CLOSURE-20261016) puts the VERIFY/SECURITY checker on opencode-go/deepseek-v4.1-flash, the SAME model the EXECUTE bounded writer holds. Model-axis independence between writer and checker is therefore deliberately ABSENT BY ORDER. The pair is demoted to distinct_required: false and the collision is recorded here rather than hidden. The lane guard refuses this pair when the declaration is absent (measured ERR_LANE_SOD_VIOLATION), so this entry is load-bearing, not documentation. What remains after model-axis independence is given up: PROCESS independence (a separate sealed CODEX-CLI process with a fresh context), LANE independence (EXECUTE makes, VERIFY_SECURITY checks), EVIDENCE-PATH independence (the checker re-derives every decisive claim from the artifacts and is forbidden from reading the writer''s summary), and the no-self-acceptance rule (the dispatcher refuses any single call that would verify its own output). What is
      NOT hedged: correlated blind spots in the shared model family -- recorded as an accepted deviation.'
    reconciliation:
      ruled_by: owner order 2026-10-16 (round ROUND3-LANE-REBIND-AND-CLOSURE-20261016)
      reclassified_from: null
    residual: maker and checker are the same model; model diversity is NOT claimed anywhere in this round's artifacts.
    superseded_by: SOD006-C4 / owner order 2026-10-21 (round FAR-REMEDIATION-20261021, epoch 23)
  - id: SOD006-C2
    pairs:
    - - PLAN
      - VERIFY_SECURITY
    axis: canonical_identity
    status: SUPERSEDED
    superseded_by: 'owner-order-20261016-lane-rebind-plan-glm-verify-deepseek (round ROUND3-LANE-REBIND-AND-CLOSURE-20261016): its premise -- PLAN and VERIFY/SECURITY sharing the openai-codex/gpt-6.1-sol default arm -- no longer holds, so the collision it recorded is gone. The order and its compensating controls are preserved here as history, never deleted.'
    note: 'Round FAR-LANE-ROUTE-REBIND-20261015 re-pointed PLAN and VERIFY_SECURITY to the same default arm (openai-codex/gpt-6.1-sol, medium); the owner order in force for round FAR-REMEDIATION-AND-CLOSURE-20261016 restates it. This is therefore NOT an open item awaiting a decision: it is an order that has been carried into force, and it is recorded as an ACCEPTED deviation rather than as a satisfied invariant. What remains after model-axis independence is given up: PROCESS independence (a separate sealed CODEX-CLI process with a fresh context), LANE independence (EXECUTE makes, VERIFY_SECURITY checks), EVIDENCE-PATH independence (the checker re-derives every decisive claim from the artifacts and is forbidden from reading the writer''s summary), and the no-self-acceptance rule (the dispatcher refuses any single call that would verify its own output). What is NOT hedged: correlated blind spots in the shared model family. EXECUTE-vs-VERIFY model separation still HOLDS (deepseek-v4.1-flash
      != gpt-6.1-sol).'
    reconciliation:
      ruled_by: owner orders 2026-10-15 and 2026-10-16 (both name openai-codex/gpt-6.1-sol for PLAN and VERIFY_SECURITY)
      reclassified_from: OPEN_OWNER_ORDERED
      reclassified_by_round: FAR-REMEDIATION-AND-CLOSURE-20261016 (R3)"
  - id: SOD-APPLY-01
    pairs:
    - - EXECUTE
      - PLAN
    axis: canonical_identity
    status: OPEN
    note: PLAN and EXECUTE were both rebound onto opencode-go/deepseek-v4.1-flash; they are both maker/executor routes and never check each other, but the model-axis collision is recorded, not hidden.
    reconciliation:
      ruled_by: owner adjudication, round HGK-SOLUTION-APPLY-20261012 (Option 1 step (a); AMENDMENT_03)
      decision_ref: FAR-RUN-W6-PLAN-SOD-020 / DEC-020-1
      what: the strict entry (maker EXECUTE, checker PLAN, distinct_required true) was REMOVED from sod_invariants.pairs. The overlap remains RECORDED here rather than refused, which is what the owner's own 2026-10-10 lane-route-slots declaration already says -- selection_semantics.sod is "NOT enforced; identity overlaps are recorded as facts only, not as refusals", and identity_overlaps_recorded_not_enforced lists this very identity.
      why_not_a_model_change: PLAN's binding (opencode-go/deepseek-v4.1-flash) is the owner's declared rank-1 DEFAULT for the PLAN lane; moving it would have been rework and would have displaced the owner's own pool declaration. The defect was the ENCODING, not the binding.
      compensating_control:
      - 'structural: PLAN and EXECUTE are both maker/executor routes and never check each other; the acceptance/verification route is the dedicated VERIFY_SECURITY lane (arm A), the only lane that checks another lane''s artifacts.'
      - 'artifact-level: every checker lane writes through the C1 verdict-artifact contract (write-first, shape-validated, updated_by_checker), so a checker cannot pass by omission.'
      - 'per-card: the reasoning pin of the checking lane is recorded per card.'
      residual: with the model axis no longer enforced between the two maker/executor routes, the remaining separation between them is ROLE and ARTIFACT, not model identity. Recorded as an accepted risk, not as a passing invariant.
  - id: SOD006-C4
    pairs:
    - - PLAN
      - VERIFY_SECURITY
    axis: canonical_identity
    status: SUPERSEDED
    statement: Owner order 2026-10-21 mandates PLAN & Orchestrator = openai-codex/gpt-6.1-sol (medium, OAuth) and VERIFY/SECURITY checker = openai-codex/gpt-6.1-sol (medium, OAuth), the SAME model on both roles.
    conflicting_clause: PLAN maker and VERIFY checker are not distinct on the model axis.
    coherent_clause: EXECUTE (deepseek-v4.1-flash) vs VERIFY (gpt-6.1-sol) is distinct; independence for the PLAN/VERIFY pair is process separation only.
    ruled_by: owner order 2026-10-21 (user turn, round FAR-REMEDIATION-20261021); pre-authorized remediation of FAR-LANE-VERSION-MIX-20261021 P0
    required_control: VERIFY runs as its own read-only Codex-CLI process with a different writer; no claim of model-axis independence for PLAN vs VERIFY.
    superseded_by: 'Owner order 2026-10-22 / registry epoch 31: VERIFY_SECURITY opencode-go/deepseek-v4.1-flash; PLAN GPT and EXECUTE MiniMax are distinct from the checker. Prior statements below are historical, not current bindings.'
  - id: SOD006-C5
    status: SUPERSEDED
    summary: EXECUTE and VERIFY_SECURITY both default to opencode-go/minimax-m3.1-flash-free (MiniMax M3.1 Flash, OPENCODE GO) by owner order 2026-10-21.
    model_axis_separation: ABSENT_BY_OWNER_ORDER
    retained: PROCESS, LANE and EVIDENCE-PATH separation plus the no-self-acceptance rule; model diversity between writer and checker is deliberately absent and is NOT claimed.
    owner_decision: CONFIRMED_BY_OWNER_ORDER_2026-10-21
    evidence: 'MEASURED 2026-10-21: all three lanes served at required_arm == served_arm == opencode-go/minimax-m3.1-flash-free; HGK admission ADMITTED for PLAN, EXECUTE and VERIFY_SECURITY (receipts under var/FAR-MINIMAX-MANDATE-20261021/admission/).'
    superseded_by: 'Owner order 2026-10-22 / registry epoch 31: VERIFY_SECURITY opencode-go/deepseek-v4.1-flash; PLAN GPT and EXECUTE MiniMax are distinct from the checker. Prior statements below are historical, not current bindings.'
  - id: SOD006-C6
    pairs:
    - - PLAN
      - VERIFY_SECURITY
    axis: canonical_identity
    status: OPEN_OWNER_ORDERED
    summary: PLAN and VERIFY_SECURITY both default to opencode-go/deepseek-v4.1-flash by owner order 2026-10-22.
    model_axis_separation: ABSENT_BY_OWNER_ORDER
    retained: PROCESS, LANE and EVIDENCE-PATH separation plus the no-self-acceptance rule. Model diversity between the planner and the checker is deliberately absent and is NOT claimed.
    reason: the owner switched PLAN off openai-codex/gpt-6.1-sol when the GPT quota was about to run out.
    owner_order: 'owner instruction 2026-10-22: switch GPT 6.1 SOL-MEDIUM (OpenAI OAuth) to DEEPSEEK V4.1 FLASH (OpenCode Go)'
  - id: SOD006-C7
    pairs:
    - - EXECUTE
      - VERIFY_SECURITY
    axis: canonical_identity
    status: OPEN_OWNER_ORDERED
    declared_by: owner order 2026-10-23 (R15) - one model for all three roles
    note: EXECUTE and VERIFY_SECURITY share the canonical identity opencode-go/deepseek-v4.1-flash. PLAN shares it too (SOD006-C6). What remains is process, lane and evidence-path separation; the checker is a separate CODEX-CLI process that is forbidden to trust the round's own summaries and must re-derive its findings. No model or provider independence is claimed.
    residual_risk: a single-model stack means one provider incident or one model-level behavioural defect can affect maker and checker in the same window; that risk is accepted by the owner order and recorded here rather than mitigated silently.
