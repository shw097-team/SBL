transport_model_constraints:
  rule_source: measured 2026-10-10 (E4/E5b/E6/E7 + direct codex probes); evidence under evidence/review/
  metadata_lookup_key: catalog slug
  claim_ceiling: A successful lane turn proves the token is routable and dispatchable. It does NOT prove the model ran with its catalog metadata (context window, reasoning levels, tool mode, apply_patch type). Any statement about model capability stays at that ceiling.
  opencode_go:
    required_form: provider-qualified slug (opencode-go/<model>)
    accepted_example: opencode-go/deepseek-v4.1-flash
    bare_name: routes, but codex prints 'Model metadata for <model> not found. Defaulting to fallback metadata'
    status: RESOLVED
  nvidia:
    required_form: nvidia/<vendor>/<model> (slash form) — routable
    catalog_slug_form: nvidia/<vendor>-<model> (hyphen form) — the catalog key
    catalog_slug_routable: false
    observed_failure_on_catalog_slug: '426 Upgrade Required / Provider stream error: Invalid request'
    accepted_trade_off: 'Routability and metadata resolution CANNOT both be satisfied for this arm: the lane keeps the routable slash form and ACCEPTS fallback metadata. This is a recorded limitation, not a defect to be repaired by renaming the token.'
    status: ACCEPTED_LIMITATION
  openai_codex:
    required_form: bare model id (gpt-6.1-sol, gpt-6-luna)
    rejected_form: openai-codex/<model> — HTTP 400 (routed to the default provider)
    catalog_entry: absent
    accepted_trade_off: No catalog entry exists for these ids, so this arm also runs on fallback metadata. Authoring catalog metadata for a model the catalog does not describe would be declaring capability facts that were never measured; that is NOT authorised and is not done.
    status: ACCEPTED_LIMITATION
