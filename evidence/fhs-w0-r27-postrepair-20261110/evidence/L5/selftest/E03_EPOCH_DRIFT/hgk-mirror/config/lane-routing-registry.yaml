  why: no family exclusion for this round — owner order 2026-10-15 restores GPT-6.1-SOL as the PLAN/VERIFY default arm (OpenAI OAuth) and GPT-6-luna as EXECUTE fallback1. The prior round's gpt-* exclusion (HGK-SOLUTION-APPLY-20261012) lapses with its round; replacement is data-only and check_exclusions remains round-scoped and fail-closed on empty provider/model.
sod_invariants:
  comparison_axis: canonical_identity
  provider_axis_required: false
  pairs:
  - maker: EXECUTE
    checker: VERIFY_SECURITY
    distinct_required: true
    note: 'Epoch 34 (2026-10-30): the owner order of 2026-10-24 separates the pair — EXECUTE writes on opencode-go/deepseek-v4.1-flash, VERIFY_SECURITY checks on openai-codex/gpt-6.1-sol — so model AND provider separation are PRESENT and distinct_required is enforced again. The former same-identity arrangement (SOD006-C7) survives only as fallback 1 in the checker chain; the dispatcher refuses a turn where the checker resolves to the writer arm.'
  - maker: PLAN
    checker: VERIFY_SECURITY
    distinct_required: false
    note: 'Epoch 40 (2026-10-31, owner order this round): VERIFY_SECURITY rank-1 returns to openai-codex/gpt-6.1-sol medium, so PLAN and VERIFY_SECURITY share the arm again and the epoch-39 claim that the pair is distinct on provider AND model no longer holds. distinct_required is therefore FALSE and the collision is declared as SOD006-C8 with status OWNER_ORDERED_IN_FORCE -- an accepted deviation, not a satisfied invariant. What is NOT given up: EXECUTE (opencode-go/deepseek-v4.1-flash) != VERIFY_SECURITY, so writer/checker model-axis separation still holds; and process, lane, evidence-path independence plus the no-self-acceptance rule remain in force. What IS given up: model-family independence between the planner and the checker, so a shared blind spot between PLAN and VERIFY is no longer detectable by identity comparison. That trade was the owner''s to make and is recorded here rather than hidden.'
  declared_conflicts:
  - id: SOD006-C8
    pairs:
    - - PLAN
      - VERIFY_SECURITY
    axis: canonical_identity
    status: OWNER_ORDERED_IN_FORCE
    note: 'Epoch 40 (2026-10-31): the owner bound the ACCEPTANCE / SECURITY REVIEW / VERIFY lane to openai-codex/gpt-6.1-sol medium again, which re-collides it with PLAN. This entry is what makes the collision LEGAL rather than merely recorded: sod_declaration_exemption() requires an OWNER_ORDERED_IN_FORCE conflict naming the exact pair, so the guard refuses a same-model pair that is not declared here. The compensating controls are the ones that do not depend on model identity: a separate sealed CODEX-CLI process with a fresh context (process independence), the checker lane never making the artefact it judges (lane independence), the checker re-deriving every decisive claim from artefacts rather than from the writer summary (evidence-path independence), and the dispatcher refusing any single call that would verify its own output (no self-acceptance).'
    reconciliation:
      ruled_by: owner order 2026-10-31 (round FHS-MSC-PIPD-LS-PKG-ALL-PASS-20261031), recorded at owner_order_20261031_allpass_verify_sol
      measured_before_rebind: 'openai-codex/gpt-6.1-sol served VERIFY_SECURITY by rank 2 in 6.75 s and echoed the round nonce; --require-arm refused it only because revision 39 listed MiMo alone (ERR_ARM_NOT_IN_ASSIGNMENT).'
  - id: SOD006-C1
    pairs:
    - - PLAN
      - VERIFY_SECURITY
    axis: canonical_identity
    status: SUPERSEDED
    resolution: WO-FAR-D1D2-FINAL-ROUTE-20261008 / REQ-FAR-D1D2-FINAL-20261008 (owner adjudication; events=947)
    resolved_by_rebinding: owner adjudication 1 (round HGK-SOLUTION-APPLY-20261012); PLAN rebound to opencode-go/deepseek-v4.1-flash so PLAN no longer collides with any VERIFY arm. Historical record preserved.
  - id: SOD006-C3
    pairs:
    - - EXECUTE
      - VERIFY_SECURITY
    axis: canonical_identity
    status: SUPERSEDED
    note: 'Owner order 2026-10-16 (round ROUND3-LANE-REBIND-AND-CLOSURE-20261016) puts the VERIFY/SECURITY checker on opencode-go/deepseek-v4.1-flash, the SAME model the EXECUTE bounded writer holds. Model-axis independence between writer and checker is therefore deliberately ABSENT BY ORDER. The pair is demoted to distinct_required: false and the collision is recorded here rather than hidden. The lane guard refuses this pair when the declaration is absent (measured ERR_LANE_SOD_VIOLATION), so this entry is load-bearing, not documentation. What remains after model-axis independence is given up: PROCESS independence (a separate sealed CODEX-CLI process with a fresh context), LANE independence (EXECUTE makes, VERIFY_SECURITY checks), EVIDENCE-PATH independence (the checker re-derives every decisive claim from the artifacts and is forbidden from reading the writer''s summary), and the no-self-acceptance rule (the dispatcher refuses any single call that would verify its own output). What is
      NOT hedged: correlated blind spots in the shared model family -- recorded as an accepted deviation.'
    reconciliation:
      ruled_by: owner order 2026-10-16 (round ROUND3-LANE-REBIND-AND-CLOSURE-20261016)
      reclassified_from: null
    residual: maker and checker are the same model; model diversity is NOT claimed anywhere in this round's artifacts.
    superseded_by: SOD006-C4 / owner order 2026-10-21 (round FAR-REMEDIATION-20261021, epoch 23)
  - id: SOD006-C2
    pairs:
    - - PLAN
      - VERIFY_SECURITY
    axis: canonical_identity
