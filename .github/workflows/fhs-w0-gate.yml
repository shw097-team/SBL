name: fhs-w0-gate
on:
  push:
    paths:
      - 'evidence/fhs-w0-r26-repair-20261109/**'
      - 'evidence/fhs-w0-r25-repair-20261109/**'
      - 'evidence/fhs-w0-r24-repair-20261109/**'
      - '.github/workflows/fhs-w0-gate.yml'
  pull_request:
    paths:
      - 'evidence/fhs-w0-r26-repair-20261109/**'
      - 'evidence/fhs-w0-r25-repair-20261109/**'
      - 'evidence/fhs-w0-r24-repair-20261109/**'
      - '.github/workflows/fhs-w0-gate.yml'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: r26 payload manifest resolves inside its own payload
        working-directory: evidence/fhs-w0-r26-repair-20261109
        run: python tools/verify_payload_manifest.py --root .
      - name: r26 gate (payload profile, includes G29)
        working-directory: evidence/fhs-w0-r26-repair-20261109
        run: python tools/gate_r20.py --round . --profile payload --scope payload --skip-hygiene
      - name: r26 signed vote quorum (17 cases, incl. the three r27 false-green refusals)
        working-directory: evidence/fhs-w0-r26-repair-20261109
        run: python tools/verify_quorum.py --selftest
      - name: r26 signed vote quorum scan (signed receipts, fail-closed)
        working-directory: evidence/fhs-w0-r26-repair-20261109
        run: python tools/verify_quorum.py --root . --json-out "$RUNNER_TEMP/quorum_scan.json"
      - name: r26 checksums
        working-directory: evidence/fhs-w0-r26-repair-20261109
        run: sha256sum -c SHA256SUMS

      - name: r25 payload manifest resolves inside its own payload
        working-directory: evidence/fhs-w0-r25-repair-20261109
        run: python tools/verify_payload_manifest.py --root .
      - name: r25 gate (payload profile, includes G29)
        working-directory: evidence/fhs-w0-r25-repair-20261109
        run: python tools/gate_r20.py --round . --profile payload --scope payload --skip-hygiene
      - name: r25 signed vote quorum (7 cases)
        working-directory: evidence/fhs-w0-r25-repair-20261109
        run: python tools/verify_quorum.py --selftest
      - name: r25 selftest contract
        working-directory: evidence/fhs-w0-r25-repair-20261109
        run: python tools/gate_r20.py --round . --profile payload --scope payload --skip-hygiene --selftest --quiet
      - name: r25 checksums
        working-directory: evidence/fhs-w0-r25-repair-20261109
        run: sha256sum -c SHA256SUMS

      - name: r24 payload manifest resolves inside its own payload
        working-directory: evidence/fhs-w0-r24-repair-20261109
        run: python tools/verify_payload_manifest.py --root .
      - name: gate (payload profile)
        working-directory: evidence/fhs-w0-r24-repair-20261109
        run: python tools/gate_r20.py --round . --profile payload --scope payload --skip-hygiene
      - name: selftest contract (read-only safe, in-process overlay, no temp dir)
        working-directory: evidence/fhs-w0-r24-repair-20261109
        run: python tools/gate_r20.py --round . --profile payload --scope payload --skip-hygiene --selftest --quiet
      - name: checksums
        working-directory: evidence/fhs-w0-r24-repair-20261109
        run: sha256sum -c SHA256SUMS
