name: ci

# Candidate-only CI. No secrets, no deploy step, read-only token.
"on":
  push:
    branches: ["main", "candidate/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      # pytest is a CI tool, not a runtime dependency: pyproject declares dependencies = [].
      # Without this the suite never ran and the job failed on "No module named pytest"
      # (external acceptance report R1, D1).
      - name: Install test tooling
        run: python -m pip install "pytest>=8,<9"

      # No extra -q: pyproject already sets addopts=-q, and a second -q raises the quiet level
      # until pytest stops printing the summary, so the job log would prove an exit code but no
      # denominator. The log must show the count.
      - name: Run test suite
        run: python -m pytest -p no:cacheprovider

      # An editable install resolves every data file straight from the source tree, so a missing
      # package-data entry is invisible to the whole suite. Round 4 found the wheel shipping without
      # sbl_sp/manifests/*.json. Build the real wheel and assert its members.
      - name: Wheel carries its runtime data
        run: python tools/check_wheel_contents.py

      # The frozen 14-book byte check needs the private corpus, which a hosted runner does not have.
      # CI verifies the published manifest's internal consistency instead; the byte-level check stays
      # a local gate. Do not fake a green source freeze on a runner that cannot see the source.
      - name: Verify published source manifest
        run: python tools/verify_source.py --self-check

  # Candidate-only check for the PIPD absorption (U04, record docs/pipd-migration/U04-CUTOVER.md).
  # It proves the three things CI can prove without the old repository's state: the absorbed tree
  # builds its own distribution, that distribution imports and runs with NO sbl-v01 installed, and
  # the CLI surface is the 13 commands the baseline records. The wider PIPD contract suite runs
  # locally (see BASELINE.md §7); the modules that assert on .hgk receipts and retired release
  # artefacts are excluded there by design, not silently here.
  pipd-compat:
    name: pipd-compat (ubuntu, py3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the absorbed PIPD tree with its test extra
        working-directory: integrations/pipd
        run: python -m pip install -e ".[test]"

      # The adapter lives in sbl_sp and imports the installed compiler; both must be present for
      # the flow test. Installing sbl-v01 does NOT pull PIPD: the dependency stays explicit.
      - name: Install the SBL product (no compiler dependency)
        run: python -m pip install -e .

      - name: Build the standalone pipd-ls-sp wheel
        working-directory: integrations/pipd
        run: python tools/build_dist.py

      - name: Independent install without the SBL package
        run: |
          set -eu
          # Run every check from a directory that is NOT the repository: with cwd at the repo root,
          # `import sbl_core` succeeds through sys.path[0] and the independence check would be a lie.
          python -m venv "$RUNNER_TEMP/pipd-indep"
          "$RUNNER_TEMP/pipd-indep/bin/pip" install --quiet integrations/pipd/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pipd-indep/bin/python" - <<'PY'
          import pipd_ls_sp
          from pipd_ls_sp import registry
          assert registry.EXPECTED_FAMILIES == 19, registry.EXPECTED_FAMILIES
          print("independent import ok:", pipd_ls_sp.__file__)
          PY
          "$RUNNER_TEMP/pipd-indep/bin/pipd" --help > "$RUNNER_TEMP/pipd-help.txt"
          head -3 "$RUNNER_TEMP/pipd-help.txt"
          if "$RUNNER_TEMP/pipd-indep/bin/python" -c "import sbl_core" 2>/dev/null; then
            echo "U04_2_VIOLATION: the pipd distribution must not resolve sbl_core outside the repo" >&2
            exit 1
          fi
          echo "U04_2_INDEPENDENT_USE_OK"

      - name: Skill packs still discover, load and route (8/8)
        working-directory: integrations/pipd
        run: python tools/skill_pack_check.py --all

      - name: Build the sbl-tpm-sp skills bundle from the single skill source
        run: python products/sbl-tpm-sp/build_bundle.py --out "$RUNNER_TEMP/sbl-tpm-sp-skills"

      - name: TPM -> PIPD adapter flow (POS and typed refusals)
        run: python -m pytest -p no:cacheprovider tests/test_pipd_adapter.py tests/test_sbl_tpm_sp_bundle.py

