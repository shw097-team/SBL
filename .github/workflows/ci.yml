name: ci

# Candidate-only CI. No secrets, no deploy step, read-only token.
"on":
  push:
    branches: ["main", "candidate/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      # pytest is a CI tool, not a runtime dependency: pyproject declares dependencies = [].
      # Without this the suite never ran and the job failed on "No module named pytest"
      # (external acceptance report R1, D1).
      - name: Install test tooling
        run: python -m pip install "pytest>=8,<9"

      - name: Run test suite
        run: python -m pytest -q -p no:cacheprovider

      # The frozen 14-book byte check needs the private corpus, which a hosted runner does not have.
      # CI verifies the published manifest's internal consistency instead; the byte-level check stays
      # a local gate. Do not fake a green source freeze on a runner that cannot see the source.
      - name: Verify published source manifest
        run: python tools/verify_source.py --self-check

