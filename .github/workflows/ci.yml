name: ci

# Candidate-only CI. No secrets, no deploy step, read-only token.
"on":
  push:
    branches: ["main", "candidate/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      # pytest is a CI tool, not a runtime dependency: pyproject declares dependencies = [].
      # Without this the suite never ran and the job failed on "No module named pytest"
      # (external acceptance report R1, D1).
      - name: Install test tooling
        run: python -m pip install "pytest>=8,<9"

      # No extra -q: pyproject already sets addopts=-q, and a second -q raises the quiet level
      # until pytest stops printing the summary, so the job log would prove an exit code but no
      # denominator. The log must show the count.
      - name: Run test suite
        run: python -m pytest -p no:cacheprovider

      # An editable install resolves every data file straight from the source tree, so a missing
      # package-data entry is invisible to the whole suite. Round 4 found the wheel shipping without
      # sbl_sp/manifests/*.json. Build the real wheel and assert its members.
      - name: Wheel carries its runtime data
        run: python tools/check_wheel_contents.py

      # The frozen 14-book byte check needs the private corpus, which a hosted runner does not have.
      # CI verifies the published manifest's internal consistency instead; the byte-level check stays
      # a local gate. Do not fake a green source freeze on a runner that cannot see the source.
      - name: Verify published source manifest
        run: python tools/verify_source.py --self-check

