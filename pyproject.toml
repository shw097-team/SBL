[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbl-v01"
version = "0.1.0"
license = "MIT"
description = "SBL / SpecBuild Loop v0.1 — candidate build (not released)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sbl-todo = "sbl_cli.sbl_todo:main"
sbl-stack = "sbl_stack.cli:main"
sbl-harness = "sbl_harness.cli:main"

[tool.setuptools]
packages = ["sbl_core", "sbl_sp", "sbl_sp.plugins", "sbl_cli", "sbl_stack", "sbl_harness"]

[tool.setuptools.package-data]
"sbl_sp" = ["manifests/*.json"]
"sbl_sp.plugins" = ["*/SKILL.md", "schema/*.json"]
"sbl_stack" = ["SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
