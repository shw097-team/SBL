[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sbl-v01"
version = "0.1.1rc1"
license = "MIT"
description = "SBL / SpecBuild Loop v0.1 — candidate build (not released)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# cryptography is required to VERIFY the owner's Ed25519 ratification of the operation->effect
# contract (CT-03). Without it the CLI fails closed with OWNER_SIGNATURE_VERIFIER_UNAVAILABLE,
# so CI installs it here rather than allowing an unverified contract to look trusted.
tpm-pre-v2 = ["jsonschema==4.26.0", "cryptography>=42"]

[project.scripts]
sbl-todo = "sbl_cli.sbl_todo:main"
sbl-stack = "sbl_stack.cli:main"
sbl-harness = "sbl_harness.cli:main"

[tool.setuptools]
packages = ["sbl_core", "sbl_sp", "sbl_sp.plugins", "sbl_sp.plugins.tpm_sp", "sbl_sp.plugins.tpm_sp.pre_v2", "sbl_cli", "sbl_stack", "sbl_harness"]

[tool.setuptools.package-data]
"sbl_sp" = ["manifests/*.json"]
"sbl_sp.plugins" = ["*/SKILL.md", "schema/*.json"]
"sbl_sp.plugins.tpm_sp.pre_v2" = ["schemas/*.json", "acceptance-source.txt", "README.md", "upstream/*.patch", "upstream/*.txt", "upstream/README.md"]
"sbl_stack" = ["SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
